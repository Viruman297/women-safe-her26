<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeHer Splash Screen</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to bottom,#f7dce8,#ffffff);
    overflow:hidden;
}

.splash{
    width:100%;
    max-width:430px;
    height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

/* Logo */

.logo{
    width:170px;
    margin-bottom:25px;
}

/* Title */

.title{
    font-size:60px;
    font-weight:700;
    letter-spacing:2px;
}

.title .safe{
    color:#2f3748;
}

.title .her{
    color:#ff2f87;
}

/* Heart Divider */

.divider{
    display:flex;
    align-items:center;
    margin:15px 0;
}

.line{
    width:90px;
    height:2px;
    background:#f7a8c8;
}

.heart{
    color:#ff4f9a;
    font-size:24px;
    margin:0 15px;
}

/* Tagline */

.tagline{
    font-size:24px;
    color:#404a5a;
    line-height:1.4;
    margin-bottom:70px;
}

/* Loader */

.loader{
    width:70px;
    height:70px;
    border-radius:50%;
    border:8px solid #ffd2e5;
    border-top:8px solid #ff3f92;
    animation:spin 1s linear infinite;
}

.loading-text{
    margin-top:20px;
    color:#ff2f87;
    font-size:22px;
    font-weight:500;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

/* Bottom Waves */

.wave1{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:160px;
    background:#ffd1e3;
    border-radius:50% 50% 0 0;
}

.wave2{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:120px;
    background:#ffc0d8;
    border-radius:50% 50% 0 0;
}

.wave3{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:80px;
    background:#ffadd0;
    border-radius:50% 50% 0 0;
}

.content{
    position:relative;
    z-index:10;
}

</style>
</head>

<body>

<div class="splash">

    <div class="content">

        <!-- Replace logo.png with your logo -->
        <img src="logo.png" class="logo">

        <div class="title">
            <span class="safe">SAFE</span><span class="her">HER</span>
        </div>

        <div class="divider">
            <div class="line"></div>
            <div class="heart">♥</div>
            <div class="line"></div>
        </div>

        <div class="tagline">
            Your Safety, Our<br>
            Priority
        </div>

        <div class="loader"></div>

        <div class="loading-text">
            Loading...
        </div>

    </div>

    <div class="wave1"></div>
    <div class="wave2"></div>
    <div class="wave3"></div>

</div>

<script>

setTimeout(()=>{
   window.location.href="home.html";
},3000);

</script>

</body>
</html>
